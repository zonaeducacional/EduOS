<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Nova aba</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://duckduckgo.com; base-uri 'none'" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fff;
      color: #202124;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      input { background: #303134; color: #e8eaed; border-color: #5f6368; }
    }
    h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -1px; }
    form { width: min(560px, 90vw); }
    input {
      width: 100%;
      height: 48px;
      padding: 0 22px;
      border: 1px solid #dadce0;
      border-radius: 24px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #1a73e8; box-shadow: 0 1px 6px #1a73e855; }
    p { margin: 0; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Mini Navegador</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" type="search" placeholder="Pesquisar com o DuckDuckGo" autofocus autocomplete="off" />
  </form>
  <p>Ctrl+T nova aba · Ctrl+L endereço · Ctrl+D favoritar · Ctrl+H histórico</p>
</body>
</html>
