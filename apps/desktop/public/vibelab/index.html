<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeLab — Arquivos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <!-- App Background with Glass/Blur effect -->
  <div class="app-background"></div>

  <!-- Window Controls (Top Right) -->
  <div class="window-controls-right">
    <button class="win-btn" id="btn-minimize" aria-label="Minimizar">-</button>
    <button class="win-btn" id="btn-maximize" aria-label="Maximizar ou restaurar">+</button>
    <button class="win-btn close-btn" id="btn-close" aria-label="Fechar">X</button>
  </div>

  <!-- Dynamic Island (Top Bar) -->
  <header id="dynamic-island" class="glass-panel">
    <!-- View Toggles & Logo -->
    <div class="left-controls" style="-webkit-app-region: no-drag; display: flex; align-items: center; gap: 8px;">
      <div class="app-brand" style="font-weight: bold; font-size: 1.1rem; color: var(--text-primary); margin-right: 16px;">VibeLab</div>
      <button class="win-btn active" id="btn-view-grid" title="Grid View" style="padding: 4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
      <button class="win-btn" id="btn-view-compact" title="Compact View" style="padding: 4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg></button>
    </div>

    <!-- Navigation Breadcrumb -->
    <div style="display: flex; gap: 8px; align-items: center; -webkit-app-region: no-drag; flex: 1; justify-content: center;">
      <button id="btn-back" class="win-btn" style="font-size: 16px; font-weight: bold; width: 40px;" title="Voltar" aria-label="Voltar">←</button>
      <div class="breadcrumb" id="breadcrumb" style="margin: 0 16px;">
        <!-- JS Injects Breadcrumb Here -->
      </div>
    </div>
    
    <!-- Utilities -->
    <div style="display: flex; gap: 8px; align-items: center; -webkit-app-region: no-drag;">
      <button id="theme-toggle" class="win-btn" style="font-size: 16px;" title="Toggle Dark Mode">🌙</button>
      <div class="search-bar">
        <input type="text" placeholder="Search..." id="search-input">
      </div>
    </div>
  </header>

  <div class="library-actions" aria-label="Operações de arquivo">
    <button id="btn-import" class="win-btn">Importar</button>
    <button id="btn-new" class="win-btn">Nova pasta</button>
    <button id="btn-rename" class="win-btn">Renomear</button>
    <button id="btn-restore" class="win-btn" hidden>Restaurar</button>
    <form id="name-form" hidden>
      <label for="item-name">Nome</label>
      <input id="item-name" maxlength="200" required>
      <button class="win-btn" type="submit">Salvar</button>
      <button id="btn-cancel" class="win-btn" type="button">Cancelar</button>
    </form>
    <span id="file-status" role="status"></span>
  </div>
  <div class="main-layout">
    <!-- Hidden Sidebar (Vertical Dock - Retangular com cantos arredondados) -->
    <nav id="sidebar" class="glass-panel">
      <ul class="nav-links" id="sidebar-links">
        <li data-path="~"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> <span class="nav-text">Meus arquivos</span></li>
        <li data-path="~/.lixeira"><span class="nav-text">Lixeira</span></li>
      </ul>
    </nav>

    <!-- Main Content Grid -->
    <main id="file-grid" class="file-grid">
      <!-- File/Folder Cards will be injected here by JS -->
    </main>
  </div>

  <!-- Zoom Control (Bottom Right) -->
  <div id="zoom-control" class="glass-panel" style="position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; z-index: 100;">
    <button id="btn-zoom-out" class="win-btn" style="width: 24px; height: 24px; border-radius: 50%;">-</button>
    <input type="range" id="zoom-slider" min="0.6" max="2" step="0.1" value="1" style="width: 80px; accent-color: var(--accent);">
    <button id="btn-zoom-in" class="win-btn" style="width: 24px; height: 24px; border-radius: 50%;">+</button>
  </div>

  <!-- Error/Debug Log (Hidden by default, shown if error) -->
  <div id="debug-log" style="position: fixed; bottom: 80px; left: 100px; max-width: 500px; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.8); color: lime; padding: 10px; border-radius: 8px; z-index: 999; font-family: monospace; font-size: 11px; pointer-events: none; display: none;"></div>

  <!-- Radial Context Menu (Hidden by default) -->
  <div id="radial-menu" class="radial-menu hidden">
    <button class="radial-btn copy">Copiar</button>
    <button class="radial-btn paste">Colar</button>
    <button class="radial-btn delete">Lixeira</button>
    <button class="radial-btn openwith">Exportar</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
