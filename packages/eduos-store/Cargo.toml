[package]
name = "eduos-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
eduos-package = { path = "../eduos-package" }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.41", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
